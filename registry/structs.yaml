# Falcon3 Struct Definitions — machine-readable structure annotations
# Validated by `python tools/naming.py check` (sizes, field overlap, dup names).
# Narrative/history lives in docs/structures.md; this file is the structured form
# (future: push-ida to create IDA structs from it).
#
# Schema per struct:
#   name:    PascalCase identifier
#   size:    total size in bytes
#   status:  confirmed | hypothesis
#   source:  evidence reference (docs/findings_log.md #, docs/structures.md section)
#   fields:  [{offset, size, name, type, comment}]
#     type:  uint8 | uint16 | uint32 | int8 | int16 | int32 | ptr16 | far_ptr |
#            bytes | seg16 | flags8

schema: 1

structs:
  - name: MZHeader
    size: 28            # 0x1C
    status: confirmed
    source: docs/structures.md §MZ Header
    fields:
      - {offset: 0x00, size: 2, name: magic,        type: uint16, comment: "'MZ'"}
      - {offset: 0x02, size: 2, name: last_page,    type: uint16}
      - {offset: 0x04, size: 2, name: pages,        type: uint16}
      - {offset: 0x06, size: 2, name: nreloc,       type: uint16, comment: 2717}
      - {offset: 0x08, size: 2, name: hdr_paras,    type: uint16, comment: 704}
      - {offset: 0x0A, size: 2, name: min_alloc,    type: uint16}
      - {offset: 0x0C, size: 2, name: max_alloc,    type: uint16}
      - {offset: 0x0E, size: 2, name: init_ss,      type: uint16}
      - {offset: 0x10, size: 2, name: init_sp,      type: uint16}
      - {offset: 0x12, size: 2, name: checksum,     type: uint16}
      - {offset: 0x14, size: 2, name: init_ip,      type: uint16}
      - {offset: 0x16, size: 2, name: init_cs,      type: uint16, comment: 0x1AA3}
      - {offset: 0x18, size: 2, name: reloc_off,    type: uint16, comment: 0x1E}
      - {offset: 0x1A, size: 2, name: overlay_no,   type: uint16}

  - name: RTLinkDirEntry            # the 18-byte overlay directory record
    size: 18
    status: confirmed
    source: docs/structures.md §18-Byte Overlay Directory + findings 17
    fields:
      - {offset: 0,  size: 2, name: seg,        type: uint16, comment: "load base (LINK para); runtime = seg+0x1000"}
      - {offset: 2,  size: 2, name: const_12ED, type: uint16, comment: "always 0x12ED"}
      - {offset: 4,  size: 2, name: w2,         type: uint16, comment: "file para of fixup table (x16); cluster-B rows use 0xFFFA0-base (finding 20)"}
      - {offset: 6,  size: 1, name: const_04,   type: uint8,  comment: "0x04"}
      - {offset: 7,  size: 1, name: flags,      type: flags8, comment: "0x04 transient, 0x01 startup"}
      - {offset: 8,  size: 2, name: span,       type: uint16, comment: "allocated span in PARAS"}
      - {offset: 10, size: 2, name: fixup_count, type: uint16, comment: "fixups in DWORDS"}
      - {offset: 12, size: 2, name: const_FFFF, type: uint16, comment: "usually 0xFFFF"}
      - {offset: 14, size: 2, name: id,         type: uint16, comment: "record id (idx+2); loader indexes by 0-based idx"}
      - {offset: 16, size: 2, name: data_size,  type: uint16, comment: "data size (== span for most)"}

  - name: RTLinkThunkEntry           # 10-byte overlay call stub
    size: 10
    status: confirmed
    source: docs/structures.md §Thunk Table + findings 17/18
    fields:
      - {offset: 0, size: 1, name: call_op,   type: uint8,  comment: "0xE8 near call"}
      - {offset: 1, size: 2, name: call_disp, type: int16,  comment: "rel16 -> loader (sub_2AFBD)"}
      - {offset: 3, size: 1, name: jmp_op,    type: uint8,  comment: "0xEA ljmp"}
      - {offset: 4, size: 2, name: jmp_off,   type: uint16}
      - {offset: 6, size: 2, name: jmp_seg,   type: seg16,  comment: "link para; runtime = +0x1000 (NOT MZ-relocated, loader patches)"}
      - {offset: 8, size: 2, name: row_index, type: uint16, comment: "0-based dir row (finding 18)"}

  - name: RTLinkFixupEntry           # one dword in a record's fixup table
    size: 4
    status: confirmed
    source: findings 17/21
    fields:
      - {offset: 0, size: 2, name: off, type: uint16, comment: "record-relative offset"}
      - {offset: 2, size: 2, name: seg, type: seg16,  comment: "para within [w0, w0+span); word[off] += 0x1000 at load (finding 21)"}

  - name: KbRecord                   # 14-byte keyboard state record (DGROUP)
    size: 14
    status: hypothesis
    source: "findings 26 (code evidence: stride 14, base link 0x22; exact field map TBD)"
    fields:
      - {offset: 0, size: 14, name: raw, type: bytes, comment: "field layout unknown - see kb_field_get/set_* hypotheses in registry/naming.yaml"}

  - name: IsldatHeader               # 9-byte header of game\ISLDAT.* theater files
    size: 9
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105 (validated 8/8 by tools/parse_isldat.py)
    fields:
      - {offset: 0x00, size: 2, name: body_len,   type: uint16, comment: "file_size - 9"}
      - {offset: 0x02, size: 2, name: grid_base,  type: uint16, comment: "0 in all 8 files; word_11C16 = grid walk base (finding 106)"}
      - {offset: 0x04, size: 2, name: t1_base,    type: uint16, comment: "always 0x500; fine-pool table (gridB)"}
      - {offset: 0x06, size: 2, name: t2_base,    type: uint16, comment: "0x504..0x7CA; coarse-pool table (gridA)"}
      - {offset: 0x08, size: 1, name: swap_flag,  type: uint8,  comment: "1=HOK/KOR/PAN; byteswaps only state_table_apply 3-byte records"}

  - name: IsldatRecord               # feature record header (then points + op-stream follow)
    size: 54                         # 0x36; variable tail at +0x38 (see comment)
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0x00, size: 4, name: x,           type: int32, comment: "16.16 nm fixed (world wrap 512)"}
      - {offset: 0x04, size: 4, name: y,           type: int32, comment: "16.16 nm fixed"}
      - {offset: 0x08, size: 4, name: z,           type: int32, comment: "~-50 LSB (0xFFFFFFCE) sea marker"}
      - {offset: 0x0C, size: 4, name: const_0,     type: int32}
      - {offset: 0x10, size: 12, name: zero_pad,   type: bytes}
      - {offset: 0x1E, size: 2, name: const_FFFF_a,type: uint16}
      - {offset: 0x20, size: 2, name: attr,        type: uint16, comment: "coordinate scale factor: 0x14=base coastline, 0x32=river, 0x64=lake, 0xC8=border; read by pos_diff_norm (shifted by attr_scale_shift, used as divisor for X/Y/Z deltas)"}
      - {offset: 0x22, size: 2, name: ptr_to_26,   type: uint16, comment: "= self+0x26 (engine self-relative)"}
      - {offset: 0x24, size: 2, name: const_000B,  type: uint16}
      - {offset: 0x26, size: 2, name: const_FFFF_b,type: uint16}
      - {offset: 0x28, size: 2, name: const_0_b,   type: uint16}
      - {offset: 0x2A, size: 2, name: ptr_to_2E,   type: uint16, comment: "= self+0x2E (engine self-relative)"}
      - {offset: 0x2C, size: 2, name: const_4,     type: uint16}
      - {offset: 0x2E, size: 2, name: point_count, type: uint16}
      - {offset: 0x30, size: 2, name: points_ptr,  type: uint16, comment: "= self+0x38 (body-absolute)"}
      - {offset: 0x32, size: 2, name: opstream_ptr,type: uint16, comment: "= points + 6*point_count"}
      - {offset: 0x34, size: 2, name: const_0_c,   type: uint16}
      # tail: +0x38 point_count x IsldatPoint, then FFFF-terminated u16
      # sub-record offsets, then sub-records inline

  - name: IsldatPoint                # one polyline point (6 bytes)
    size: 6
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0, size: 2, name: p0,  type: int16, comment: "coordinate component"}
      - {offset: 2, size: 2, name: mid, type: int16, comment: "always 0 in all 8 files"}
      - {offset: 4, size: 2, name: p2,  type: int16, comment: "coordinate component"}

  - name: IsldatSubRecord             # sub-record header (nodes follow)
    size: 4
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105 (196/196 subs validated)
    fields:
      - {offset: 0, size: 2, name: flags,  type: uint16, comment: "0x1000/0x1002 = node chain until FFFF; 0x0000/0x0002 = exactly one node, no terminator"}
      - {offset: 2, size: 2, name: opcode, type: uint16, comment: "0/1/2 observed (1 dominant); semantics unknown"}

  - name: IsldatNode                  # closed ring of runtime line-table entries
    size: 2                           # variable: 2 + 2*(count+1) bytes (count field only fits schema)
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0, size: 2, name: count, type: uint16, comment: "payload follows: (count+1) x uint16 offsets into line table (stride 0x10), last==first (closed)"}

  # ---- S4 analysis findings (2026-11-12) ----

  - name: FarObj
    size: 210        # minimum confirmed; actual may be larger
    status: hypothesis
    source: "analysis/s4/farobj_callers.log — Level-0 farobj callers probe, S4 2026-11-12"
    notes: >
      Central game object instance record. Stored in a global slot table at
      R05_400C:0x34 (4 bytes/entry = far pointer per slot). Also referenced from
      scan list at 0x54AF:0x1734 (16 entries for active-object fast scan).
      farptr_table_get(slot_index) loads ES:DI = pointer to this struct.
      Struct is at least 210B; actual size unknown. Many fields confirmed by
      farobj_entity_attr_setup (initialiser) + farptr_table_accum_fields (3D pos add).
    fields:
      # 3D world position: each axis is a 32-bit little-endian integer (lo:hi words)
      - {offset: 0x00, size: 2, name: world_x_lo,     type: int16,  comment: "X position lo word (int32 split)"}
      - {offset: 0x02, size: 2, name: world_x_hi,     type: int16,  comment: "X position hi word"}
      - {offset: 0x04, size: 2, name: world_y_lo,     type: int16,  comment: "Y position lo word"}
      - {offset: 0x06, size: 2, name: world_y_hi,     type: int16,  comment: "Y position hi word"}
      - {offset: 0x08, size: 2, name: world_z_lo,     type: int16,  comment: "Z position lo word"}
      - {offset: 0x0A, size: 2, name: world_z_hi,     type: int16,  comment: "Z position hi word"}
      # 3D orientation: 14-bit angles masked with 0x3FFF (heading) or fold-to-signed
      - {offset: 0x0C, size: 2, name: angle_heading,  type: uint16, comment: "heading angle (14-bit, 0x3FFF mask); 0xFFFF = uninit"}
      - {offset: 0x0E, size: 2, name: angle_pitch,    type: int16,  comment: "pitch angle (14-bit signed, fold via stub_to_24988)"}
      - {offset: 0x10, size: 2, name: angle_roll,     type: uint16, comment: "roll/yaw angle (14-bit)"}
      # Type and category
      - {offset: 0x12, size: 1, name: render_flags,   type: uint8,  comment: "render flags (HUD-related)"}
      - {offset: 0x13, size: 1, name: type_flags,     type: flags8, comment: "type flags (AND 0x20 OR 5 pattern; bit 6 = range visibility)"}
      - {offset: 0x14, size: 1, name: entity_class,   type: uint8,  comment: "entity class code: 0x12=aircraft, 0x14=?, 0x33=?, 0x38=?"}
      - {offset: 0x15, size: 1, name: entity_class_hi, type: uint8, comment: "high byte of entity class word (usually 0 or sub-class)"}
      - {offset: 0x16, size: 2, name: attr_a,         type: int16,  comment: "type-specific attribute A (from type descriptor +0xE)"}
      - {offset: 0x18, size: 2, name: attr_b,         type: int16,  comment: "scaled attribute B (from type descriptor +0xC, shifted by DS:19B7)"}
      - {offset: 0x1A, size: 2, name: attr_c,         type: int16,  comment: "scaled attribute C (from type descriptor +0x10)"}
      - {offset: 0x1C, size: 2, name: field_1C,       type: uint16, comment: "unknown"}
      - {offset: 0x1E, size: 2, name: frame_timer,    type: uint16, comment: "frame counter (mod 8 by scan_74_timer_c for animation step)"}
      - {offset: 0x20, size: 2, name: cmd_field,      type: uint16, comment: "command/state field (farptr_table_field_store/_get at DI+0x20)"}
      - {offset: 0x22, size: 2, name: object_kind,    type: uint16, comment: "object kind index → type descriptor (farobj_type_field_get -> 1/2/3)"}
      - {offset: 0x24, size: 2, name: state_flags,    type: flags16, comment: "state flags: bit 0x0040=has_ext_slot; bit 0x8000=scan_gate_set; bits 0xF1FF=timer state"}
      - {offset: 0x26, size: 1, name: slot_flags,     type: flags8, comment: "slot flags: bits 0–5 used; bits 6+7 cleared by sub_49A5B"}
      - {offset: 0x27, size: 1, name: slot_id,        type: uint8,  comment: "0xFF = unassigned/uninit; entity slot id (entity_slot_create)"}
      # Type-dependent data at 0x28..0x2D (layout depends on object_kind type 1/2/3)
      - {offset: 0x28, size: 2, name: type_ext_0,    type: uint16, comment: "type-dependent (farobj_copy_invoke copies starting here)"}
      - {offset: 0x2A, size: 2, name: type_base,     type: uint16, comment: "base type data (farobj_field_set writes here for type 1 & 3)"}
      - {offset: 0x2C, size: 2, name: type_ext_A,    type: uint16, comment: "ext data A (farobj_field_set +2 for type 2)"}
      # ... fields 0x2E..0x73 unknown ...
      - {offset: 0x74, size: 1, name: active,         type: flags8, comment: "slot active/occupied flag: bit 0 = active (checked by scan_74 functions)"}
      # ... fields 0x75..0x79 unknown ...
      - {offset: 0x7A, size: 2, name: self_slot_idx,  type: uint16, comment: "this object's index in the main farobj table (R05_400C:0x34 slot N)"}
      # ... fields 0x7C..0xD0 unknown ...
      - {offset: 0xD1, size: 1, name: timer_active,   type: flags8, comment: "timer active flag: bit 0 = do timer update (farobj_scan_74_timer_c)"}

  - name: FarObjTypeDesc
    size: 18         # minimum; indexed via FarObj.object_kind*4 from table at 0x7B0E:0x3052
    status: hypothesis
    source: "farobj_type_field_get (0x2647E) + farobj_entity_attr_setup (0x44352)"
    notes: >
      Per-entity-class type descriptor. The global table at 0x7B0E:0x3052 holds far
      pointers (4B each) to these records, indexed by FarObj.object_kind*4.
      farobj_type_field_get reads bytes [0] and [1] to return a 1/2/3 subtype code.
      farobj_entity_attr_setup reads offsets 0x0C/0x0E/0x10 as scaled entity attributes.
    fields:
      - {offset: 0x00, size: 1, name: type_category, type: uint8,  comment: "0 or 1 = simple; >1 = complex (has subtype in byte 1)"}
      - {offset: 0x01, size: 1, name: subtype,        type: uint8,  comment: "subtype code (1/2/3) returned by farobj_type_field_get for complex types"}
      - {offset: 0x0C, size: 2, name: scale_attr_b,   type: int16,  comment: "scaled attribute B source (attr_b = this << DS:0x19B7)"}
      - {offset: 0x0E, size: 2, name: raw_attr_a,     type: int16,  comment: "raw attribute A copied to FarObj.attr_a"}
      - {offset: 0x10, size: 2, name: scale_attr_c,   type: int16,  comment: "scaled attribute C source (attr_c = this << DS:0x19B7)"}

  - name: EntityAccumEntry
    size: 14         # 0x0E bytes; in sweep table at DS:0x54AF:0x4ED, up to 40 entries
    status: hypothesis
    source: "farobj_entity_accum_sweep (0x2E48C)"
    notes: >
      Per-motion-command entry for the entity sweep table.
      farobj_entity_accum_sweep scans up to 39+1 entries (index 0..0x27),
      advancing by 14B per entry. Entry [+6] is a countdown timer (decremented
      each sweep; when 0, entry is idle). The BX/CX/DX words drive
      farptr_table_accum_fields (position delta) and farptr_table_offset_apply (angle delta).
    fields:
      - {offset: 0x00, size: 2, name: count,     type: uint16, comment: "0 = empty entry; nonzero = active"}
      - {offset: 0x02, size: 2, name: delta_x,   type: int16,  comment: "X position delta for farptr_table_accum_fields"}
      - {offset: 0x04, size: 2, name: delta_y,   type: int16,  comment: "Y position delta"}
      - {offset: 0x06, size: 2, name: countdown, type: uint16, comment: "timer countdown; decremented by 1 each sweep (at +1 to get 0-based next)"}
      - {offset: 0x08, size: 2, name: delta_hdg, type: int16,  comment: "heading delta for farptr_table_offset_apply"}
      - {offset: 0x0A, size: 2, name: delta_pit, type: int16,  comment: "pitch delta"}
      - {offset: 0x0C, size: 2, name: delta_rol, type: int16,  comment: "roll delta"}
