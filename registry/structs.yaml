# Falcon3 Struct Definitions — machine-readable structure annotations
# Validated by `python tools/naming.py check` (sizes, field overlap, dup names).
# Narrative/history lives in docs/structures.md; this file is the structured form
# (future: push-ida to create IDA structs from it).
#
# Schema per struct:
#   name:    PascalCase identifier
#   size:    total size in bytes
#   status:  confirmed | hypothesis
#   source:  evidence reference (docs/findings_log.md #, docs/structures.md section)
#   fields:  [{offset, size, name, type, comment}]
#     type:  uint8 | uint16 | uint32 | int8 | int16 | int32 | ptr16 | far_ptr |
#            bytes | seg16 | flags8

schema: 1

structs:
  - name: MZHeader
    size: 28            # 0x1C
    status: confirmed
    source: docs/structures.md §MZ Header
    fields:
      - {offset: 0x00, size: 2, name: magic,        type: uint16, comment: "'MZ'"}
      - {offset: 0x02, size: 2, name: last_page,    type: uint16}
      - {offset: 0x04, size: 2, name: pages,        type: uint16}
      - {offset: 0x06, size: 2, name: nreloc,       type: uint16, comment: 2717}
      - {offset: 0x08, size: 2, name: hdr_paras,    type: uint16, comment: 704}
      - {offset: 0x0A, size: 2, name: min_alloc,    type: uint16}
      - {offset: 0x0C, size: 2, name: max_alloc,    type: uint16}
      - {offset: 0x0E, size: 2, name: init_ss,      type: uint16}
      - {offset: 0x10, size: 2, name: init_sp,      type: uint16}
      - {offset: 0x12, size: 2, name: checksum,     type: uint16}
      - {offset: 0x14, size: 2, name: init_ip,      type: uint16}
      - {offset: 0x16, size: 2, name: init_cs,      type: uint16, comment: 0x1AA3}
      - {offset: 0x18, size: 2, name: reloc_off,    type: uint16, comment: 0x1E}
      - {offset: 0x1A, size: 2, name: overlay_no,   type: uint16}

  - name: RTLinkDirEntry            # the 18-byte overlay directory record
    size: 18
    status: confirmed
    source: docs/structures.md §18-Byte Overlay Directory + findings 17
    fields:
      - {offset: 0,  size: 2, name: seg,        type: uint16, comment: "load base (LINK para); runtime = seg+0x1000"}
      - {offset: 2,  size: 2, name: const_12ED, type: uint16, comment: "always 0x12ED"}
      - {offset: 4,  size: 2, name: w2,         type: uint16, comment: "file para of fixup table (x16); cluster-B rows use 0xFFFA0-base (finding 20)"}
      - {offset: 6,  size: 1, name: const_04,   type: uint8,  comment: "0x04"}
      - {offset: 7,  size: 1, name: flags,      type: flags8, comment: "0x04 transient, 0x01 startup"}
      - {offset: 8,  size: 2, name: span,       type: uint16, comment: "allocated span in PARAS"}
      - {offset: 10, size: 2, name: fixup_count, type: uint16, comment: "fixups in DWORDS"}
      - {offset: 12, size: 2, name: const_FFFF, type: uint16, comment: "usually 0xFFFF"}
      - {offset: 14, size: 2, name: id,         type: uint16, comment: "record id (idx+2); loader indexes by 0-based idx"}
      - {offset: 16, size: 2, name: data_size,  type: uint16, comment: "data size (== span for most)"}

  - name: RTLinkThunkEntry           # 10-byte overlay call stub
    size: 10
    status: confirmed
    source: docs/structures.md §Thunk Table + findings 17/18
    fields:
      - {offset: 0, size: 1, name: call_op,   type: uint8,  comment: "0xE8 near call"}
      - {offset: 1, size: 2, name: call_disp, type: int16,  comment: "rel16 -> loader (sub_2AFBD)"}
      - {offset: 3, size: 1, name: jmp_op,    type: uint8,  comment: "0xEA ljmp"}
      - {offset: 4, size: 2, name: jmp_off,   type: uint16}
      - {offset: 6, size: 2, name: jmp_seg,   type: seg16,  comment: "link para; runtime = +0x1000 (NOT MZ-relocated, loader patches)"}
      - {offset: 8, size: 2, name: row_index, type: uint16, comment: "0-based dir row (finding 18)"}

  - name: RTLinkFixupEntry           # one dword in a record's fixup table
    size: 4
    status: confirmed
    source: findings 17/21
    fields:
      - {offset: 0, size: 2, name: off, type: uint16, comment: "record-relative offset"}
      - {offset: 2, size: 2, name: seg, type: seg16,  comment: "para within [w0, w0+span); word[off] += 0x1000 at load (finding 21)"}

  - name: KbRecord                   # 14-byte keyboard state record (DGROUP)
    size: 14
    status: hypothesis
    source: "findings 26 (code evidence: stride 14, base link 0x22; exact field map TBD)"
    fields:
      - {offset: 0, size: 14, name: raw, type: bytes, comment: "field layout unknown - see kb_field_get/set_* hypotheses in registry/naming.yaml"}

  - name: IsldatHeader               # 9-byte header of game\ISLDAT.* theater files
    size: 9
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105 (validated 8/8 by tools/parse_isldat.py)
    fields:
      - {offset: 0x00, size: 2, name: body_len,   type: uint16, comment: "file_size - 9"}
      - {offset: 0x02, size: 2, name: grid_base,  type: uint16, comment: "0 in all 8 files; word_11C16 = grid walk base (finding 106)"}
      - {offset: 0x04, size: 2, name: t1_base,    type: uint16, comment: "always 0x500; fine-pool table (gridB)"}
      - {offset: 0x06, size: 2, name: t2_base,    type: uint16, comment: "0x504..0x7CA; coarse-pool table (gridA)"}
      - {offset: 0x08, size: 1, name: swap_flag,  type: uint8,  comment: "1=HOK/KOR/PAN; byteswaps only state_table_apply 3-byte records"}

  - name: IsldatRecord               # feature record header (then points + op-stream follow)
    size: 54                         # 0x36; variable tail at +0x38 (see comment)
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0x00, size: 4, name: x,           type: int32, comment: "16.16 nm fixed (world wrap 512)"}
      - {offset: 0x04, size: 4, name: y,           type: int32, comment: "16.16 nm fixed"}
      - {offset: 0x08, size: 4, name: z,           type: int32, comment: "~-50 LSB (0xFFFFFFCE) sea marker"}
      - {offset: 0x0C, size: 4, name: const_0,     type: int32}
      - {offset: 0x10, size: 12, name: zero_pad,   type: bytes}
      - {offset: 0x1E, size: 2, name: const_FFFF_a,type: uint16}
      - {offset: 0x20, size: 2, name: attr,        type: uint16, comment: "coordinate scale factor: 0x14=base coastline, 0x32=river, 0x64=lake, 0xC8=border; read by pos_diff_norm (shifted by attr_scale_shift, used as divisor for X/Y/Z deltas)"}
      - {offset: 0x22, size: 2, name: ptr_to_26,   type: uint16, comment: "= self+0x26 (engine self-relative)"}
      - {offset: 0x24, size: 2, name: const_000B,  type: uint16}
      - {offset: 0x26, size: 2, name: const_FFFF_b,type: uint16}
      - {offset: 0x28, size: 2, name: const_0_b,   type: uint16}
      - {offset: 0x2A, size: 2, name: ptr_to_2E,   type: uint16, comment: "= self+0x2E (engine self-relative)"}
      - {offset: 0x2C, size: 2, name: const_4,     type: uint16}
      - {offset: 0x2E, size: 2, name: point_count, type: uint16}
      - {offset: 0x30, size: 2, name: points_ptr,  type: uint16, comment: "= self+0x38 (body-absolute)"}
      - {offset: 0x32, size: 2, name: opstream_ptr,type: uint16, comment: "= points + 6*point_count"}
      - {offset: 0x34, size: 2, name: const_0_c,   type: uint16}
      # tail: +0x38 point_count x IsldatPoint, then FFFF-terminated u16
      # sub-record offsets, then sub-records inline

  - name: IsldatPoint                # one polyline point (6 bytes)
    size: 6
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0, size: 2, name: p0,  type: int16, comment: "coordinate component"}
      - {offset: 2, size: 2, name: mid, type: int16, comment: "always 0 in all 8 files"}
      - {offset: 4, size: 2, name: p2,  type: int16, comment: "coordinate component"}

  - name: IsldatSubRecord             # sub-record header (nodes follow)
    size: 4
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105 (196/196 subs validated)
    fields:
      - {offset: 0, size: 2, name: flags,  type: uint16, comment: "0x1000/0x1002 = node chain until FFFF; 0x0000/0x0002 = exactly one node, no terminator"}
      - {offset: 2, size: 2, name: opcode, type: uint16, comment: "0/1/2 observed (1 dominant); semantics unknown"}

  - name: IsldatNode                  # closed ring of runtime line-table entries
    size: 2                           # variable: 2 + 2*(count+1) bytes (count field only fits schema)
    status: confirmed
    source: docs/structures.md §ISLDAT + finding 105
    fields:
      - {offset: 0, size: 2, name: count, type: uint16, comment: "payload follows: (count+1) x uint16 offsets into line table (stride 0x10), last==first (closed)"}

  # ---- S4 analysis findings (2026-11-12) ----

  - name: FarObj
    size: 210        # minimum confirmed; actual may be larger
    status: hypothesis
    source: "analysis/s4/farobj_callers.log — Level-0 farobj callers probe, S4 2026-11-12"
    notes: >
      Central game object instance record. Stored in a global slot table at
      R05_400C:0x34 (4 bytes/entry = far pointer per slot). Also referenced from
      scan list at 0x54AF:0x1734 (16 entries for active-object fast scan).
      farptr_table_get(slot_index) loads ES:DI = pointer to this struct.
      Struct is at least 210B; actual size unknown. Many fields confirmed by
      farobj_entity_attr_setup (initialiser) + farptr_table_accum_fields (3D pos add).
    fields:
      # 3D world position: each axis is a 32-bit little-endian integer (lo:hi words)
      - {offset: 0x00, size: 2, name: world_x_lo,     type: int16,  comment: "X position lo word (int32 split)"}
      - {offset: 0x02, size: 2, name: world_x_hi,     type: int16,  comment: "X position hi word"}
      - {offset: 0x04, size: 2, name: world_y_lo,     type: int16,  comment: "Y position lo word"}
      - {offset: 0x06, size: 2, name: world_y_hi,     type: int16,  comment: "Y position hi word"}
      - {offset: 0x08, size: 2, name: world_z_lo,     type: int16,  comment: "Z position lo word"}
      - {offset: 0x0A, size: 2, name: world_z_hi,     type: int16,  comment: "Z position hi word"}
      # 3D orientation: 14-bit angles masked with 0x3FFF (heading) or fold-to-signed
      - {offset: 0x0C, size: 2, name: angle_heading,  type: uint16, comment: "heading angle (14-bit, 0x3FFF mask); 0xFFFF = uninit"}
      - {offset: 0x0E, size: 2, name: angle_pitch,    type: int16,  comment: "pitch angle (14-bit signed, fold via stub_to_24988)"}
      - {offset: 0x10, size: 2, name: angle_roll,     type: uint16, comment: "roll/yaw angle (14-bit)"}
      # Type and category
      - {offset: 0x12, size: 1, name: render_flags,   type: uint8,  comment: "render flags (HUD-related)"}
      - {offset: 0x13, size: 1, name: type_flags,     type: flags8, comment: "type flags (AND 0x20 OR 5 pattern; bit 6 = range visibility)"}
      - {offset: 0x14, size: 1, name: entity_class,   type: uint8,  comment: "entity class code: 0x12=aircraft, 0x14=?, 0x33=?, 0x38=?"}
      - {offset: 0x15, size: 1, name: entity_class_hi, type: uint8, comment: "high byte of entity class word (usually 0 or sub-class)"}
      - {offset: 0x16, size: 2, name: attr_a,         type: int16,  comment: "type-specific attribute A (from type descriptor +0xE)"}
      - {offset: 0x18, size: 2, name: attr_b,         type: int16,  comment: "scaled attribute B (from type descriptor +0xC, shifted by DS:19B7)"}
      - {offset: 0x1A, size: 2, name: attr_c,         type: int16,  comment: "scaled attribute C (from type descriptor +0x10)"}
      - {offset: 0x1C, size: 2, name: field_1C,       type: uint16, comment: "unknown"}
      - {offset: 0x1E, size: 2, name: frame_timer,    type: uint16, comment: "frame counter (mod 8 by scan_74_timer_c for animation step)"}
      - {offset: 0x20, size: 2, name: cmd_field,      type: uint16, comment: "command/state field (farptr_table_field_store/_get at DI+0x20)"}
      - {offset: 0x22, size: 2, name: object_kind,    type: uint16, comment: "object kind index → type descriptor (farobj_type_field_get -> 1/2/3)"}
      - {offset: 0x24, size: 2, name: state_flags,    type: flags16, comment: "state flags: bit 0x0040=has_ext_slot; bit 0x8000=scan_gate_set; bits 0xF1FF=timer state"}
      - {offset: 0x26, size: 1, name: slot_flags,     type: flags8, comment: "slot flags: bits 0–5 used; bits 6+7 cleared by sub_49A5B"}
      - {offset: 0x27, size: 1, name: slot_id,        type: uint8,  comment: "0xFF = unassigned/uninit; entity slot id (entity_slot_create)"}
      # Type-dependent data at 0x28..0x2D (layout depends on object_kind type 1/2/3)
      - {offset: 0x28, size: 2, name: type_ext_0,    type: uint16, comment: "type-dependent (farobj_copy_invoke copies starting here)"}
      - {offset: 0x2A, size: 2, name: type_base,     type: uint16, comment: "base type data (farobj_field_set writes here for type 1 & 3)"}
      - {offset: 0x2C, size: 2, name: type_ext_A,    type: uint16, comment: "ext data A (farobj_field_set +2 for type 2)"}
      # ... fields 0x2E..0x73 unknown ...
      - {offset: 0x74, size: 1, name: active,         type: flags8, comment: "slot active/occupied flag: bit 0 = active (checked by scan_74 functions)"}
      # ... fields 0x75..0x79 unknown ...
      - {offset: 0x7A, size: 2, name: self_slot_idx,  type: uint16, comment: "this object's index in the main farobj table (R05_400C:0x34 slot N)"}
      # ... fields 0x7C..0xD0 unknown ...
      - {offset: 0xD1, size: 1, name: timer_active,   type: flags8, comment: "timer active flag: bit 0 = do timer update (farobj_scan_74_timer_c)"}

  - name: FarObjTypeDesc
    size: 18         # minimum; indexed via FarObj.object_kind*4 from table at 0x7B0E:0x3052
    status: hypothesis
    source: "farobj_type_field_get (0x2647E) + farobj_entity_attr_setup (0x44352)"
    notes: >
      Per-entity-class type descriptor. The global table at 0x7B0E:0x3052 holds far
      pointers (4B each) to these records, indexed by FarObj.object_kind*4.
      farobj_type_field_get reads bytes [0] and [1] to return a 1/2/3 subtype code.
      farobj_entity_attr_setup reads offsets 0x0C/0x0E/0x10 as scaled entity attributes.
    fields:
      - {offset: 0x00, size: 1, name: type_category, type: uint8,  comment: "0 or 1 = simple; >1 = complex (has subtype in byte 1)"}
      - {offset: 0x01, size: 1, name: subtype,        type: uint8,  comment: "subtype code (1/2/3) returned by farobj_type_field_get for complex types"}
      - {offset: 0x0C, size: 2, name: scale_attr_b,   type: int16,  comment: "scaled attribute B source (attr_b = this << DS:0x19B7)"}
      - {offset: 0x0E, size: 2, name: raw_attr_a,     type: int16,  comment: "raw attribute A copied to FarObj.attr_a"}
      - {offset: 0x10, size: 2, name: scale_attr_c,   type: int16,  comment: "scaled attribute C source (attr_c = this << DS:0x19B7)"}

  - name: EntityAccumEntry
    size: 14         # 0x0E bytes; in sweep table at DS:0x54AF:0x4ED, up to 40 entries
    status: hypothesis
    source: "farobj_entity_accum_sweep (0x2E48C)"
    notes: >
      Per-motion-command entry for the entity sweep table.
      farobj_entity_accum_sweep scans up to 39+1 entries (index 0..0x27),
      advancing by 14B per entry. Entry [+6] is a countdown timer (decremented
      each sweep; when 0, entry is idle). The BX/CX/DX words drive
      farptr_table_accum_fields (position delta) and farptr_table_offset_apply (angle delta).
    fields:
      - {offset: 0x00, size: 2, name: count,     type: uint16, comment: "0 = empty entry; nonzero = active"}
      - {offset: 0x02, size: 2, name: delta_x,   type: int16,  comment: "X position delta for farptr_table_accum_fields"}
      - {offset: 0x04, size: 2, name: delta_y,   type: int16,  comment: "Y position delta"}
      - {offset: 0x06, size: 2, name: countdown, type: uint16, comment: "timer countdown; decremented by 1 each sweep (at +1 to get 0-based next)"}
      - {offset: 0x08, size: 2, name: delta_hdg, type: int16,  comment: "heading delta for farptr_table_offset_apply"}
      - {offset: 0x0A, size: 2, name: delta_pit, type: int16,  comment: "pitch delta"}
      - {offset: 0x0C, size: 2, name: delta_rol, type: int16,  comment: "roll delta"}

  # ---- AI System (docs/architecture/ai.md) ----

  - name: AIContext
    size: 24         # 0x18 bytes; 40 contexts at DS:0x65A7:0x000C
    status: confirmed
    source: "docs/architecture/ai.md; ai_context_batch_processor (0x495DF)"
    notes: >
      AI entity context for behavior processing. Array of 40 at segment 0x65A7,
      offset 0x000C (linear 0x065A7C). Processed every frame by ai_context_batch_processor.
      Contains entity state, behavior flags, target tracking, and movement parameters.
    fields:
      - {offset: 0x00, size: 2, name: entity_slot_idx, type: uint16, comment: "Index to main entity slot table"}
      - {offset: 0x02, size: 2, name: farobj_slot_idx, type: uint16, comment: "Index to farobj main table"}
      - {offset: 0x04, size: 2, name: behavior_flags,  type: flags16, comment: "Behavior state flags (loaded from external tables)"}
      - {offset: 0x06, size: 2, name: target_slot_idx, type: uint16, comment: "Target entity index for tracking/mirroring"}
      - {offset: 0x08, size: 2, name: state_word,      type: uint16, comment: "AI state machine state"}
      - {offset: 0x0A, size: 2, name: timer,           type: uint16, comment: "Behavior timer/countdown"}
      - {offset: 0x0C, size: 2, name: angle_to_target, type: int16,  comment: "Angle to target (for weapon firing)"}
      - {offset: 0x0E, size: 2, name: distance,        type: uint16, comment: "Distance to target or waypoint"}
      - {offset: 0x10, size: 2, name: velocity_x,      type: int16,  comment: "Movement parameter X"}
      - {offset: 0x12, size: 2, name: velocity_y,      type: int16,  comment: "Movement parameter Y"}
      - {offset: 0x14, size: 4, name: reserved,        type: bytes,  comment: "Last 4 bytes (purpose unknown)"}

  # ---- Flight Physics System (docs/architecture/flight_physics.md) ----

  - name: FlightKinematics
    size: 26         # 13 words = 26 bytes
    status: confirmed
    source: "docs/architecture/flight_physics.md; flight_kinematics_position_step (0x3B338)"
    notes: >
      26-byte flight state block at DS:[0x32]. Contains position, velocity, tile
      coordinates, and angles. Mirrored to DS:[0x66] (previous frame) and
      ES:0x7B0E:0x43BA (trig segment). Updated every frame by position integration.
    fields:
      - {offset: 0x00, size: 2, name: world_x_lo,      type: int16,  comment: "World X position lo word"}
      - {offset: 0x02, size: 2, name: world_x_hi,      type: int16,  comment: "World X position hi word (int32 split)"}
      - {offset: 0x04, size: 2, name: world_y_lo,      type: int16,  comment: "World Y position lo word"}
      - {offset: 0x06, size: 2, name: world_y_hi,      type: int16,  comment: "World Y position hi word"}
      - {offset: 0x08, size: 2, name: world_z_lo,      type: int16,  comment: "World Z position lo word (altitude)"}
      - {offset: 0x0A, size: 2, name: world_z_hi,      type: int16,  comment: "World Z position hi word"}
      - {offset: 0x0C, size: 2, name: tile_x,          type: int16,  comment: "Tile coordinate X"}
      - {offset: 0x0E, size: 2, name: tile_y,          type: int16,  comment: "Tile coordinate Y"}
      - {offset: 0x10, size: 2, name: velocity_x,      type: int16,  comment: "Velocity X component"}
      - {offset: 0x12, size: 2, name: velocity_y,      type: int16,  comment: "Velocity Y component"}
      - {offset: 0x14, size: 2, name: velocity_z,      type: int16,  comment: "Velocity Z component"}
      - {offset: 0x16, size: 2, name: angle_pitch,     type: int16,  comment: "Pitch angle (14-bit)"}
      - {offset: 0x18, size: 2, name: field_18,        type: uint16, comment: "Unknown field"}

  - name: AircraftSlot
    size: 24         # 0x18 bytes; stride in 40-slot array
    status: confirmed
    source: "docs/architecture/flight_physics.md; flight_aircraft_slot_cycle_update (0x49546)"
    notes: >
      Aircraft/entity slot record processed by flight system. Array of 40 slots
      processed in cycle by flight_aircraft_slot_cycle_update. Links to farobj
      and entity systems.
    fields:
      - {offset: 0x00, size: 1, name: flags,           type: flags8,  comment: "0=inactive; bit 2=collision; bit 4=respawn"}
      - {offset: 0x01, size: 2, name: farobj_slot,     type: uint16,  comment: "FarObj main table index"}
      - {offset: 0x03, size: 2, name: entity_type,     type: uint16,  comment: "Entity type/class code"}
      - {offset: 0x05, size: 2, name: state_flags,     type: flags16, comment: "State/behavior flags"}
      - {offset: 0x07, size: 2, name: timer,           type: uint16,  comment: "Countdown timer"}
      - {offset: 0x09, size: 15, name: data,           type: bytes,   comment: "Type-specific data (15 bytes)"}

  - name: EntitySlotRecord
    size: 204        # 0xCC bytes minimum; 16 slots at 0x54AF:0x386F
    status: confirmed
    source: "docs/architecture/entity.md; farobj_slot_update_driver; RADAR_DETECTION_COMPLETE.md; IR_LOCK_ANALYSIS.md; TARGET_SYSTEM_FINDINGS.md; BUILDING_TYPE_INVESTIGATION.md"
    notes: >
      Active entity slot record. 16 slots at segment 0x54AF, offset 0x386F.
      Updated 3-pass every frame by farobj_slot_update_driver. Contains per-frame
      processing state, update flags, and links to farobj instances.
      Radar system uses fields +0x08/0x0A (distance), +0x74/+0x79 (flags),
      +0x8E (azimuth), +0x92 (range), +0x96/98/9A (position) for detection and tracking.
      IR lock system uses field +0xAE (heat_signature) for AIM-9 seeker targeting.
      Target system uses fields +0x76 (unknown_flags_76), +0xAE (heat_signature), 
      +0xB3-0xBF (target tracking fields, 13 bytes), +0xCA (damage_status_flags).
      AI system uses fields +0xB3-0xBF for target priority evaluation (ai_target_priority_evaluator).
    fields:
      - {offset: 0x00, size: 6, name: header,          type: bytes,   comment: "Unknown header fields"}
      - {offset: 0x06, size: 2, name: farobj_slot,     type: uint16,  comment: "FarObj main table slot index"}
      - {offset: 0x08, size: 2, name: distance_lo,     type: uint16,  comment: "Distance to player lo word (32-bit pair with +0x0A)"}
      - {offset: 0x0A, size: 2, name: distance_hi,     type: uint16,  comment: "Distance to player hi word"}
      - {offset: 0x0C, size: 2, name: object_category,  type: uint16,  comment: "Object category/type (4=building/facility, checked by store_impact_step @ 0x39840)"}
      - {offset: 0x0E, size: 2, name: data_0E_0F,      type: bytes,   comment: "Unknown bytes 0x0E-0x0F"}
      - {offset: 0x10, size: 1, name: impact_state,    type: uint8,   comment: "Impact/damage state (0xFF=pristine, 0xA0=impacted, set by store_impact_step @ 0x39879)"}
      - {offset: 0x11, size: 29, name: data_11_2D,     type: bytes,   comment: "Entity data bytes 0x11-0x2D"}
      - {offset: 0x2E, size: 2, name: velocity_component, type: int16,   comment: "Velocity component (receives gravity/drag subtract @ 0x3D3BD). Possibly vertical velocity or velocity magnitude."}
      - {offset: 0x30, size: 68, name: data_30_73,     type: bytes,   comment: "Entity data bytes 0x30-0x73"}
      - {offset: 0x74, size: 1, name: status_flags,    type: flags8,  comment: "EntityStatusFlags: bit 0=ACTIVE, bit 2=DESTROYED?, bit 6=AIRCRAFT_TYPE"}
      - {offset: 0x75, size: 1, name: weapon_type,     type: uint8,   comment: "Weapon type (WeaponType enum: 0x12-0x37). Checked by entity_physics_and_ai_update for weapon-specific behavior. 0=not a weapon."}
      - {offset: 0x76, size: 1, name: unknown_flags_76, type: flags8, comment: "Unknown flags (bit 7 checked by target_cycle_scan @ 0x48B05)"}
      - {offset: 0x77, size: 23, name: data_77_8D,     type: bytes,   comment: "Unknown bytes 0x77-0x8D"}
      - {offset: 0x8E, size: 2, name: angle_azimuth,   type: uint16,  comment: "Azimuth angle from player (14-bit, 0x0000-0x3FFF), used for radar cone detection"}
      - {offset: 0x90, size: 2, name: data_90_91,      type: bytes,   comment: "Unknown bytes (possibly elevation angle)"}
      - {offset: 0x92, size: 2, name: range,           type: uint16,  comment: "Computed range/distance to player (game units), compared against F8 radar range setting"}
      - {offset: 0x94, size: 5, name: data_94_78,      type: bytes,   comment: "Unknown bytes 0x94-0x78"}
      - {offset: 0x79, size: 1, name: tracking_flags,  type: flags8,  comment: "EntityTrackingFlags: bit 0=RADAR_VISIBLE (set by detection functions)"}
      - {offset: 0x7A, size: 2, name: target_slot_index, type: uint16, comment: "Target entity slot index. Used by store_impact_step @ 0x397FB to load target entity via r12_farptr_load_thunk. Indexes EntitySlotRecord array (stride 0x5C=92B)."}
      - {offset: 0x7C, size: 26, name: data_7C_95,     type: bytes,   comment: "Unknown bytes 0x7C-0x95"}
      - {offset: 0x96, size: 2, name: position_x,      type: int16,   comment: "World X position (used by radar scanner)"}
      - {offset: 0x98, size: 2, name: position_y,      type: int16,   comment: "World Y position (used by radar scanner)"}
      - {offset: 0x9A, size: 2, name: position_z,      type: int16,   comment: "World Z position / altitude (used by radar scanner)"}
      - {offset: 0x9C, size: 18, name: data_9C_AD,     type: bytes,   comment: "Unknown bytes 0x9C-0xAD"}
      - {offset: 0xAE, size: 1, name: heat_signature,  type: uint8,   comment: "IR visibility (0=cold/no lock, non-zero=hot/IR lockable). Checked by weapon_aim9_seeker_lock_check for AIM-9 IR missiles. Also checked as unknown_field_ae by target_cycle_scan @ 0x48B05."}
      - {offset: 0xAF, size: 4, name: data_AF_B2,      type: bytes,   comment: "Unknown bytes 0xAF-0xB2"}
      - {offset: 0xB3, size: 1, name: target_field_1,  type: uint8,   comment: "Target tracking field 1 (checked by ai_target_priority_evaluator @ 0x3E96F)"}
      - {offset: 0xB4, size: 1, name: target_field_2,  type: uint8,   comment: "Target tracking field 2"}
      - {offset: 0xB5, size: 1, name: target_field_3,  type: uint8,   comment: "Target tracking field 3"}
      - {offset: 0xB6, size: 1, name: target_field_4,  type: uint8,   comment: "Target tracking field 4"}
      - {offset: 0xB7, size: 1, name: target_field_5,  type: uint8,   comment: "Target tracking field 5"}
      - {offset: 0xB8, size: 1, name: target_field_6,  type: uint8,   comment: "Target tracking field 6"}
      - {offset: 0xB9, size: 1, name: target_field_7,  type: uint8,   comment: "Target tracking field 7"}
      - {offset: 0xBA, size: 1, name: target_field_8,  type: uint8,   comment: "Target tracking field 8"}
      - {offset: 0xBB, size: 1, name: target_field_9,  type: uint8,   comment: "Target tracking field 9"}
      - {offset: 0xBC, size: 1, name: target_field_10, type: uint8,   comment: "Target tracking field 10"}
      - {offset: 0xBD, size: 1, name: target_field_11, type: uint8,   comment: "Target tracking field 11"}
      - {offset: 0xBE, size: 1, name: target_field_12, type: uint8,   comment: "Target tracking field 12"}
      - {offset: 0xBF, size: 1, name: target_field_13, type: uint8,   comment: "Target tracking field 13"}
      - {offset: 0xC0, size: 10, name: data_C0_C9,     type: bytes,   comment: "Unknown bytes 0xC0-0xC9"}
      - {offset: 0xCA, size: 2, name: damage_status_flags, type: flags16, comment: "Damage state flags (DAMAGE_NAV flag at 0x48B05). Checked by target_cycle_scan for filtering damaged entities."}
      - {offset: 0xCC, size: 0, name: end_marker,      type: bytes,   comment: "End of confirmed fields at +0xCC (actual size may be larger)"}

  # ---- A-G Weapon Entity (AG_WEAPONS_ANALYSIS.md) ----

  - name: AGWeaponEntity
    size: 41         # 0x29 bytes (A-G weapon queue stride)
    status: partial
    source: "AG_WEAPONS_ANALYSIS.md; ag_weapon_entity_initialize @ 0x4C3C7"
    notes: >
      A-G weapon entity initialization structure. Used for bombs, missiles, and guided weapons (types 0x14-0x32).
      41-byte queue stride vs 27 bytes for A-A missiles/guns - 14 extra bytes for ballistics and guidance.
    fields:
      - {offset: 0x00, size: 2, name: entity_ptr,        type: uint16,  comment: "Pointer to launching entity (bp register value)"}
      - {offset: 0x02, size: 1, name: type_flags,        type: flags8,  comment: "Weapon type flags (varies: 0x02-0x0B for different weapons)"}
      - {offset: 0x03, size: 1, name: type_id,           type: uint8,   comment: "Type ID (always 0xFF in initialization?)"}
      - {offset: 0x04, size: 2, name: zero_field,        type: uint16,  comment: "Always set to bp (0) during initialization"}
      - {offset: 0x06, size: 2, name: param_06,          type: uint16,  comment: "Parameter (varies: 0x0A-0x31C)"}
      - {offset: 0x08, size: 2, name: initial_velocity,  type: uint16,  comment: "Initial velocity in game units/sec (2710-4734 for bombs, 3280-4860 for missiles)"}
      - {offset: 0x0A, size: 2, name: param_0A,          type: uint16,  comment: "Parameter (varies: 8-24)"}
      - {offset: 0x0C, size: 2, name: launch_angle,      type: uint16,  comment: "Launch angle computed from aircraft vector (14-bit angle)"}
      - {offset: 0x0E, size: 2, name: velocity_copy_1,   type: uint16,  comment: "Velocity copy (usually same as +0x08)"}
      - {offset: 0x10, size: 2, name: velocity_copy_2,   type: uint16,  comment: "Velocity copy (usually same as +0x08)"}
      - {offset: 0x12, size: 2, name: param_12,          type: uint16,  comment: "Parameter (varies widely: 0xAB-0x400)"}
      - {offset: 0x14, size: 11, name: data_14_1E,       type: bytes,   comment: "Unknown data bytes 0x14-0x1E"}
      - {offset: 0x1F, size: 2, name: velocity_copy_3,   type: uint16,  comment: "Velocity copy (usually same as +0x08)"}
      - {offset: 0x21, size: 2, name: param_21,          type: uint16,  comment: "Parameter (varies: 3-0x5DC)"}
      - {offset: 0x23, size: 1, name: damage_or_life,    type: uint8,   comment: "Damage value or lifetime (0-200: 2=low, 20=medium, 200=high)"}
      - {offset: 0x24, size: 5, name: data_24_28,        type: bytes,   comment: "Unknown data bytes 0x24-0x28 (end of structure)"}

  # ---- 3D Object Model Format (docs/architecture/3d_objects.md) ----

  - name: ObjectModelHeader
    size: 12         # minimum; variable size
    status: confirmed
    source: "docs/architecture/3d_objects.md"
    notes: >
      Header for .3D object model files (aircraft, ground units, etc.).
      Followed by vertex array, edge array, and rendering data.
    fields:
      - {offset: 0x00, size: 2, name: file_size_minus_10, type: uint16, comment: "Total file size - 10"}
      - {offset: 0x02, size: 2, name: vertex_count,       type: uint16, comment: "Number of vertices in vertex array"}
      - {offset: 0x04, size: 2, name: edge_count,         type: uint16, comment: "Number of edges in edge array"}
      - {offset: 0x06, size: 6, name: header_data,        type: bytes,  comment: "Additional header data"}

  - name: ObjectModelVertex
    size: 6          # 3x int16
    status: confirmed
    source: "docs/architecture/3d_objects.md"
    fields:
      - {offset: 0x00, size: 2, name: x, type: int16, comment: "Signed X coordinate"}
      - {offset: 0x02, size: 2, name: y, type: int16, comment: "Signed Y coordinate"}
      - {offset: 0x04, size: 2, name: z, type: int16, comment: "Signed Z coordinate"}

  - name: ObjectModelEdge
    size: 4          # 2x int16
    status: confirmed
    source: "docs/architecture/3d_objects.md"
    fields:
      - {offset: 0x00, size: 2, name: v1, type: int16, comment: "Vertex index 1 (signed)"}
      - {offset: 0x02, size: 2, name: v2, type: int16, comment: "Vertex index 2 (signed)"}

