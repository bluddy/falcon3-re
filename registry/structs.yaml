enums:
  # ---- Radar System (RADAR_MODE_STATE_MACHINE.md) ----
  
  - name: RadarModeState
    type: uint8
    source: "RADAR_MODE_STATE_MACHINE.md; byte_595B2 (DS:0x595B2)"
    description: "Primary radar mode state variable"
    values:
      - {value: 0, name: SEARCH,   comment: "Radar searching, no mode selected"}
      - {value: 1, name: NAM,      comment: "Normal Air Mode (or arcade equivalent)"}
      - {value: 2, name: SAM,      comment: "Situation Awareness Mode (intermediate tracking)"}
      - {value: 3, name: ACM,      comment: "Air Combat Maneuvering (close range)"}
      - {value: 4, name: DISABLED, comment: "Mode disabled/invalid"}
      - {value: 5, name: STT,      comment: "Single Target Track (locked)"}

  - name: RadarType
    type: uint8
    source: "RADAR_MODE_STATE_MACHINE.md; byte_59573 (DS:0x59573)"
    description: "Radar type configuration selector"
    values:
      - {value: 0, name: SAD, comment: "Situation Awareness Display (360° arcade)"}
      - {value: 1, name: SAM, comment: "Situation Awareness Mode (120° cone intermediate)"}
      - {value: 2, name: HFR, comment: "High Fidelity Radar (realistic manual control)"}

  - name: EntityStatusFlags
    type: uint8
    source: "RADAR_MODE_STATE_MACHINE.md; EntitySlotRecord+0x74"
    description: "Entity status flags at entity+0x74, used by radar scanner"
    bitflags:
      - {bit: 0, mask: 0x01, name: ACTIVE,        comment: "Entity slot is active/alive"}
      - {bit: 1, mask: 0x02, name: BIT1_UNKNOWN,  comment: "Unknown"}
      - {bit: 2, mask: 0x04, name: BIT2_UNKNOWN,  comment: "Unknown"}
      - {bit: 3, mask: 0x08, name: BIT3_UNKNOWN,  comment: "Unknown"}
      - {bit: 4, mask: 0x10, name: BIT4_UNKNOWN,  comment: "Unknown"}
      - {bit: 5, mask: 0x20, name: BIT5_UNKNOWN,  comment: "Unknown"}
      - {bit: 6, mask: 0x40, name: AIRCRAFT_TYPE, comment: "Entity is aircraft (required for radar visibility)"}
      - {bit: 7, mask: 0x80, name: BIT7_UNKNOWN,  comment: "Unknown"}

  - name: EntityTrackingFlags
