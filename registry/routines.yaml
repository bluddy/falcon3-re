# Falcon3 Routine Registry — the convergence ledger
# One entry per routine we have learned something about.
# Updated when: classified, hypothesized (named), ported, verified, or disproven.
# History/rationale lives in docs/findings_log.md; byte-level formats in docs/structures.md.
#
# Schema (per entry):
#   ea:           linear address in IDA (load base 0x10000)
#   seg / ofs:    segment:offset (ea >> 4, ea & 0xF)
#   size:         bytes
#   far:          is far function (retf)
#   class:        C | ASM | DATA | THUNK | UNKNOWN       (classification)
#   hypothesis:   semantic name we believe it has        (rename target; null if none)
#   port_status:  unported | draft | verified | not_c-portable
#   port_file:    src/<name>.c or src/<name>.asm
#   verified:     MATCH | MISMATCH | null
#   notes:        free-form (evidence, disprovals, cross-refs)
#   updated:      date
#
# Conventions:
#   - "verified" means portcheck_falcon.py produced byte-identical output vs
#     function_bytes.json ground truth.
#   - Renaming: GOES THROUGH registry/naming.yaml + tools/naming.py (apply/check/
#     push-ida). This file holds port status; hypothesis must equal the ledger name.
#   - Never delete entries; set class/status to disproven values with notes.

