  - ida: sub_112A1
    name: input_status_pack
    kind: function
    sig: "AL=in nibble arg; AL=out merged status; clobbers CX; R-M-W on cs:11102"
    notes: "37B, 318K calls (hottest leaf). Shares cs:11102 with joystick_poll; nibble-shift+OR merge then R-M-W. conf: low — semantics of the merge not yet pinned down"
  - ida: sub_16F10
