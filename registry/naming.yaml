# Falcon3 Naming Ledger — canonical semantic names for binary symbols
# Managed by tools/naming.py (apply / check / resolve / push-ida). DO NOT hand-edit
# name/ida pairs unless you also run `naming.py check` afterwards.
#
# Schema:
#   ida:    immutable machine ID (matches IDB names + function_bytes.json keys)
#           NEVER changes; safe to reference everywhere in tooling.
#   name:   semantic rename (C identifier rules: [a-z_][a-z0-9_]*).
#           null = keep ida name for now.
#   kind:   function | global | struct | field
#   notes:  why this name (evidence / hypothesis source); update when disproven.
#
# Apply targets: src/**.c, src/asm/**.asm (text), function_bytes.json +
# data_symbols.json ("name" fields only - keys stay ida), IDB (push-ida).
# routines.yaml `hypothesis` must equal `name` here when both exist (naming.py check).

schema: 1

