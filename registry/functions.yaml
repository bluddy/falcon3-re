      Also loads radar_config_byte_related (byte_59574) from +0x0C. Sets radar_config_flag_1 (byte_59575) and 
      radar_config_flag_2 (byte_59576) based on byte_59574: if 0, sets to 2 and 4 respectively, else 0 and 0. 
      Loads other config bytes to byte_55B4E (+0x0E), byte_55B5F (+0x18), byte_59380 (+0x10), byte_59381 (+0x12). 
      Checks byte_54F67 and EMS state flags to conditionally zero audio settings. Called at startup to initialize 
      avionics configuration from player preferences. Originally record_script_coord_entry.
