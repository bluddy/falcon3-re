  - address: 0x39D02
    name: radar_display_position_calculator
    system: radar
    size: 106
    doc: >
      Radar target display position calculator. Called by radar_acm_target_step (mode_stream_select_step) after target found. 
      Inputs: radar_display_x_adjusted (word_59597) with perspective-adjusted X coordinate, 
      radar_display_mode_flag (byte_595B6) for scaling mode. Computes screen coordinates with scaling: 
      (x - 159) * 2731 / 67, then applies mode-specific bounds and scale factors. 
      Mode 0: bounds [0x1C7, 0xFE39], clamped range [0xF71C, 0x8E4]. 
      Mode 1: bounds [0x555, 0xFAAB], clamped to bounds. 
      Mode 2+: bounds [0xAAB, 0xF555], no clamping. 
      Outputs: radar_display_bounds_left (word_5958B), radar_display_bounds_right (word_5958D), 
      radar_display_center_offset (word_59585). These define screen region for rendering mode text 
      ("NAM", "ACM", "STT") and target reticle. Originally undoc_39D02.
    source: RADAR_MODE_STATE_MACHINE.md, radar_key_handlers.txt
