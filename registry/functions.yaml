      Checks: (1) radar_mode_state != 3 and radar_mode_flag != 0 for special handling,
      (2) Azimuth cone: abs(entity.angle_azimuth - 0x1000) <= 0xE3 (±5° from forward, 14-bit angle system),
      (3) Radar type branching: if radar_type_selector==1 (SAM) skips distance check, else calls farobj_dist_bounds_4ac0,
      (4) Range check: calls bound_table_check_49b8(entity.range) against F8 bounds (radar_range_min/max).
      If all checks pass: OR entity+0x79, 0x01 (set RADAR_VISIBLE). If any fail: AND entity+0x79, 0xFE (clear).
      The 0xE3 constant is likely the narrowest F9 azimuth setting and may be dynamically modified.
      Originally farobj_floor_match_dispatch.
