# Falcon 3.0 Function Registry
# 
# This is the SINGLE source of truth for all function names.
# Format: YAML for readability and tool compatibility
# 
# Schema:
#   address: hex address (e.g., 0x11450)
#   name: descriptive function name (system_component_action_detail)
#   system: which system it belongs to
#   size: size in bytes (optional)
#   doc: description of what it does
#   source: where we learned about it (optional)

schema: 1

