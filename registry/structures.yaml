---
# Falcon 3.0 Data Structures Registry
# Synced with IDA database
#
# Format:
#   name: structure_name
#   size: total size in bytes
#   fields:
#     - offset: hex offset from base
#       name: field_name
#       type: c_type (uint8_t, uint16_t, uint32_t, etc.)
#       description: what this field does
#       evidence: where we found this (code address, pattern, etc.)

# ============================================================================
# UI / MENU STRUCTURES
# ============================================================================

- name: MenuElement
  size: 28  # 0x1C bytes
  description: |
    Menu element structure used by R45 squadron management menu.
    Array of 11 elements (0x0B) initialized in position_calculator.
    Base address: 0x4FC2:0x600
  evidence:
    - address: 0x156599
      pattern: "mov dx, 1Ch; imul dx; loop to 0Bh"
    - address: 0x1565C9
      pattern: "cmp di, 0Bh; jl loop"
  fields:
    - offset: 0x604
      name: data_ptr_low
      type: uint16_t
      description: Low word of far pointer to element data
      evidence: "mov word ptr es:[bx+604h], 0"
      
    - offset: 0x606
      name: data_ptr_high
      type: uint16_t
      description: High word of far pointer to element data (segment)
      evidence: "mov word ptr es:[bx+606h], 0"
      
    - offset: 0x608
      name: state_or_type
      type: uint16_t
      description: Element state or type (values 0, 3, 10 observed)
      evidence: "mov word ptr es:[bx+608h], 3"

# Structure appears to have more fields, but only 3 are currently identified

- name: UICoordinate
  size: 8  # Estimated from access patterns
  description: |
    UI coordinate structure containing position data.
    Multiple instances referenced via far pointers (dword_79E3A, dword_79E2C, etc.)
  evidence:
    - address: 0x15621E
      pattern: "les bx, es:dword_79E2C; push word ptr es:[bx+2]; push word ptr es:[bx]"
  fields:
    - offset: 0x0
      name: x_or_low
      type: uint16_t
      description: X coordinate or low word
      evidence: "push word ptr es:[bx]"
      
    - offset: 0x2
      name: y_or_high
      type: uint16_t
      description: Y coordinate or high word
      evidence: "push word ptr es:[bx+2]"
      
    - offset: 0x4
      name: width_or_offset
      type: uint16_t
      description: Width or offset value
      evidence: "add ax, es:[bx+4]"
      
    - offset: 0x6
      name: height_or_offset2
      type: uint16_t
      description: Height or second offset value
      evidence: "add ax, es:[bx+6]"

- name: DataPointer
  size: 8  # Approximate
  description: |
    Generic data pointer structure with sentinel/validity check.
    Used throughout menus.
  evidence:
    - address: 0x156232
      pattern: "cmp word ptr es:[bx+1], 0FFFFh"
  fields:
    - offset: 0x0
      name: data_byte
      type: uint8_t
      description: Data or index byte
      evidence: "cmp byte ptr es:[bx], 0FFh"
      
    - offset: 0x1
      name: validity_flag
      type: uint16_t
      description: Validity flag (0xFFFF = invalid/end marker)
      evidence: "cmp word ptr es:[bx+1], 0FFFFh"

# ============================================================================
# PILOT STRUCTURES  
# ============================================================================

- name: PilotRecord
  size: 66  # 0x42 bytes - EXACT SIZE FROM .SQU FILE FORMAT
  description: |
    Pilot record structure as stored in .SQU squadron files.
    30 pilots per squadron starting at file offset 0x3C.
    In-memory structures mirror file format.
  evidence:
    - file_format: SQUAD files specification
    - loader_function: squad_campaign_file_loader at 0x6A651
    - string_refs: NAME CALLSIGN MISSIONS PLANE KILLS
  fields:
    - offset: 0x00
      name: status_flags
      type: uint8_t[2]
      description: Status flags (flying, dead, MIA, POW, etc.)
      evidence: .SQU file offset 0x00
      
    - offset: 0x02
      name: rank
      type: uint8_t  # PilotRank enum
      description: Officer rank (0=LT, 1=CAPT, 2=MAJOR, 3=LT COL, 4=COL)
      evidence: .SQU file offset 0x02, rank strings at 0x150088-0x1500A6
      
    - offset: 0x03
      name: callsign
      type: char[15]
      description: Pilot callsign string (null-terminated)
      evidence: .SQU file offset 0x03, string "CALLSIGN:" at 0x150AD1
      
    - offset: 0x12
      name: pad1
      type: uint8_t
      description: Padding byte
      evidence: .SQU file offset 0x12
      
    - offset: 0x13
      name: nickname
      type: char[15]
      description: Pilot nickname/name string (null-terminated)
      evidence: .SQU file offset 0x13, string "NAME:" at 0x150033
      
    - offset: 0x22
      name: id_code
      type: char[4]
      description: 4-character pilot ID code
      evidence: .SQU file offset 0x22
      
    - offset: 0x26
      name: dogfighting_skill
      type: uint8_t
      description: Dogfighting ability rating (0-255)
      evidence: .SQU file offset 0x26, string "-DOGFIGHTING:" at 0x150AFC
      
    - offset: 0x27
      name: bombing_skill
      type: uint8_t
      description: Bombing/strike ability rating (0-255)
      evidence: .SQU file offset 0x27
      
    - offset: 0x28
      name: flying_skill
      type: uint8_t
      description: General flying ability rating (0-255)
      evidence: .SQU file offset 0x28
      
    - offset: 0x29
      name: fatigue_level
      type: uint8_t
      description: Current fatigue level (affects performance)
      evidence: .SQU file offset 0x29, string "FATIGUE" at 0x150C6D
      
    - offset: 0x2A
      name: mission_data
      type: uint8_t[28]
      description: |
        Mission statistics and history (28 bytes):
        - missions flown
        - flight hours
        - kills (plane, ground)
        - awards, merits
        - ordnance efficiency
        Layout TBD via reverse engineering
      evidence: .SQU file offset 0x2A-0x45, strings at 0x150049-0x1500A6

# Pilots 20-29 have extended records at 0x7F8 (same 66-byte format)

- name: ExtendedPilotRecord
  size: 66  # 0x42 bytes
  description: |
    Extended pilot record for pilots 20-29 in squadron.
    Located at file offset 0x7F8 in .SQU files.
    Same structure as PilotRecord.
  evidence:
    - file_format: SQUAD*.SQU file offset 0x7F8
  fields:
    # Same fields as PilotRecord
    - offset: 0x00
      name: status_flags
      type: uint8_t[2]
      
    - offset: 0x02
      name: rank
      type: uint8_t
      
    - offset: 0x03
      name: callsign
      type: char[15]
      
    - offset: 0x12
      name: pad1
      type: uint8_t
      
    - offset: 0x13
      name: nickname
      type: char[15]
      
    - offset: 0x22
      name: id_code
      type: char[4]
      
    - offset: 0x26
      name: dogfighting_skill
      type: uint8_t
      
    - offset: 0x27
      name: bombing_skill
      type: uint8_t
      
    - offset: 0x28
      name: flying_skill
      type: uint8_t
      
    - offset: 0x29
      name: fatigue_level
      type: uint8_t
      
    - offset: 0x2A
      name: mission_data
      type: uint8_t[28]

# ============================================================================
# SQUADRON STRUCTURES
# ============================================================================

- name: SquadronHeader
  size: 60  # 0x3C bytes
  description: |
    Squadron metadata header from .SQU file.
    Contains squadron slot, theater, and statistics.
  evidence:
    - file_format: SQUAD*.SQU file offset 0x00-0x3B
    - analyzed: SQUAD0.SQU, SQUAD1.SQU headers
  fields:
    - offset: 0x00
      name: squadron_slot
      type: uint8_t
      description: Squadron slot number (0-N)
      evidence: SQUAD1.SQU byte 0 = 1
      
    - offset: 0x01
      name: active_flag
      type: uint8_t
      description: Squadron active/enabled flag (0=inactive, 1=active, 0xFF=empty)
      evidence: SQUAD0.SQU = 0, SQUAD1.SQU = 1, SQUAD2.SQU = 0xFF
      
    - offset: 0x02
      name: theater_id
      type: uint8_t  # TheaterID enum
      description: Theater assignment (0=Israel, 1=Korea, etc.)
      evidence: SQUAD1.SQU byte 2 = 0 (Israel theater)
      
    - offset: 0x03
      name: theater_name
      type: char[12]
      description: Theater name string (null-padded)
      evidence: SQUAD1.SQU bytes 3-14 = "Israel"
      
    - offset: 0x0F
      name: wing_or_type
      type: uint8_t
      description: Wing assignment or squadron type
      evidence: SQUAD1.SQU byte 0x0F = 4
      
    - offset: 0x10
      name: statistics
      type: uint8_t[44]
      description: |
        Squadron statistics (44 bytes):
        - missions flown
        - pilots active/killed/MIA
        - kills (air, ground)
        - awards
        Layout TBD via menu analysis
      evidence: Bytes 0x10-0x3B, strings from R45 menu

- name: SquadronFile
  size: 2703  # 0xA8F bytes - EXACT SIZE FROM FILE SYSTEM
  description: |
    Complete .SQU squadron file structure.
    Header (60 bytes) + 30 pilots (1980 bytes) + extended pilots (660 bytes) + footer.
  evidence:
    - file_format: SQUAD*.SQU files are all 2703 bytes
    - loader_function: squad_campaign_file_loader at 0x6A651
    - string_refs: "SQUADRON NAME:", "SQUADRON COMMANDER:"
  fields:
    - offset: 0x00
      name: header
      type: uint8_t[60]
      description: |
        Squadron header (60 bytes, 0x3C):
        - squadron name
        - wing assignment
        - statistics (missions, kills, etc.)
        Layout TBD via reverse engineering
      evidence: Pilots start at 0x3C
      
    - offset: 0x3C
      name: pilots
      type: PilotRecord[30]
      description: Array of 30 pilot records (30 × 66 = 1980 bytes, 0x7BC)
      evidence: .SQU file format, 30 pilots × 0x42 bytes
      
    - offset: 0x7F8
      name: extended_pilots
      type: ExtendedPilotRecord[10]
      description: Extended records for pilots 20-29 (10 × 66 = 660 bytes, 0x294)
      evidence: .SQU file format
      
    - offset: 0xA8C
      name: footer
      type: uint8_t[3]
      description: Footer data (3 bytes to reach 2703 total)
      evidence: File size 2703 bytes

- name: SquadronHeader
  size: 60  # 0x3C bytes - estimated from pilot start offset
  description: |
    Squadron metadata header from .SQU file.
    Contains name, wing, commander, statistics.
    Exact field layout TBD via code analysis.
  evidence:
