      description: Pilot index of squadron commander (0-29)
      evidence: String "SQUADRON COMMANDER:" at 0x150C9D
      
    - offset: null
      name: missions_flown
      type: uint16_t
      description: Total squadron missions
      evidence: String "NUMBER OF MISSIONS FLOWN:" at 0x150CB1
      
    - offset: null
      name: pilots_active
      type: uint16_t
      description: Number of active pilots
      evidence: String "NUMBER OF PILOTS ACTIVE:" at 0x150DD7
      
    - offset: null
      name: pilots_killed
      type: uint16_t
      description: Number of pilots KIA
      evidence: String "NUMBER OF PILOTS KILLED:" at 0x150DF1
      
    - offset: null
