- name: FlightRecord
  size: 130  # 0x82 bytes - from R57 analysis
  description: |
    Flight configuration record.
    From R57 weapons loadout menu analysis.
  evidence:
    - address: 0x1A5B16  # From R57
      pattern: "130-byte records, 0x82 multiplication"
  fields:
    - offset: null
      name: aircraft_count
      type: uint8_t
      description: Number of aircraft in flight (1-4)
      
    - offset: null
      name: loadouts
      type: LoadoutRecord[4]
      description: Array of 4 loadout records (23 bytes each)

- name: LoadoutRecord
