      Index of currently selected radar target in entity array (stride=4). Value 0xFFFF means no target selected. 
      Used by mode_stream_select_step to cycle through targets with F6 ACM stepping. 
      Wraps at boundary 0x40 (16 entities). Set by target scanning loop, cleared by floor_bounds_set_9f.
    source: RADAR_MODE_STATE_MACHINE.md
  
