# Falcon 3.0 Global Variables Registry
# 
# This is the SINGLE source of truth for all global variable names.
# Format: YAML for readability and tool compatibility
# 
# Schema:
#   address: DS-relative offset (e.g., 0x3840)
#   name: descriptive variable name (system_component_purpose)
#   segment: segment number if not DS (optional)
#   size: size in bytes
#   type: data type (array, struct, word, byte, etc.)
#   doc: description of what it stores
#   source: where we learned about it (optional)

schema: 1

globals:
  # ===========================================================================
  # TERRAIN SYSTEM
  # ===========================================================================
  
  - address: 0x3840
    name: terrain_heightmap_31x31
    size: 1922
    type: array[31x31]
    doc: 31×31 height samples for terrain tile rendering, bilinear interpolation source
    source: TERRAIN_SYSTEM_100_PERCENT_COMPLETE.md
    
  - address: 0x7A0
    name: terrain_lod_scale_table
    size: 16
    type: array[8]
    doc: 8-level LOD distance scaling table for terrain detail
    source: docs/architecture/terrain.md
  
