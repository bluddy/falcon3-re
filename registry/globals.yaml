  - address: 0x595B2
    name: radar_mode_state
    size: 1
    type: byte
    doc: >
      Primary radar mode state variable. 0=search inactive, 1=NAM (Normal Air Mode), 
      2=SAM (Situation Awareness Mode / intermediate tracking), 3=ACM (Air Combat Maneuvering), 
      4=disabled/invalid, 5=STT (Single Target Track / locked). Set by r06_mode_step_dispatch 
      based on F5/F6/F7 keys in HFR mode. Checked by mode_stream_select_step and 27 other functions.
    source: RADAR_MODE_STATE_MACHINE.md
  
  - address: 0x59573
    name: radar_type_selector
    size: 1
    type: byte
    doc: >
      Radar type configuration selector. Values: 0=SAD (Situation Awareness Display, 360° arcade), 
      1=SAM (120° cone intermediate), 2=HFR (High Fidelity Radar, realistic manual control with submodes). 
      Loaded from config segment 706Eh offset +0x14, transformed as -(config_value - 2). 
      Gates F5/F6/F7 functionality: submodes only work when value=2 (HFR mode). 
      When <=1, mode_stream_select_step jumps to steerpoint_scan_update instead of target tracking.
    source: RADAR_MODE_STATE_MACHINE.md
  
  - address: 0x5959B
