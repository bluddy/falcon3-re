# ============================================================================
# STATE MACHINE ENUMS  
# ============================================================================

- name: R45MenuState
  type: uint16_t
  description: |
    R45 squadron menu state machine states.
    State variable: word_13E012 (0x13E012)
  evidence:
    - address: 0x156A17
      pattern: "cmp es:word_13E012, 5; jle"
    - code_analysis: "R45 menu uses states 0-5 plus 0xFFFF exit"
  values:
    - value: 0
      name: R45_STATE_0
      description: Initial state / squadron selection
      evidence: "mov es:word_13E012, 0 at 0x156995"
      
    - value: 1
      name: R45_STATE_1
      description: State 1 (purpose unknown)
      evidence: Incremented from state 0
      
    - value: 2
      name: R45_STATE_2
      description: State 2 (purpose unknown)
      evidence: Comparison value 2 at multiple locations
      
    - value: 3
      name: R45_STATE_3
      description: State 3 (purpose unknown)
      
    - value: 4
      name: R45_STATE_4
      description: State 4 (purpose unknown)
      
    - value: 5
      name: R45_STATE_5
      description: State 5 (final state before wrap)
      evidence: "cmp es:word_13E012, 5 at 0x156A17"
      
    - value: 0xFFFF
      name: R45_STATE_EXIT
      description: Exit state (return to previous menu)
      evidence: "mov es:word_13E012, 0FFFFh at 0x156A4E"

- name: R57MenuState
  type: uint16_t
  description: |
    R57 weapons loadout menu state machine states.
    State variable: word_13E012 (0x13E012) - SHARED with R45
  evidence:
    - doc: docs/R57_WEAPONS_LOADOUT_MENU_ANALYSIS.md
  values:
    - value: 0
      name: R57_STATE_FLIGHT_SELECT
      description: Select flight (1-4)
      
    - value: 1
      name: R57_STATE_AIRCRAFT_SELECT
      description: Select aircraft within flight
      
    - value: 2
      name: R57_STATE_NAVIGATE_FIELDS
      description: Navigate form fields
      
    - value: 3
      name: R57_STATE_MODIFY_DATA
      description: Modify data entry
      
    - value: 4
      name: R57_STATE_WEAPON_CONFIG
      description: Weapon configuration
      
    - value: 5
      name: R57_STATE_VALIDATE
      description: Validate and save
      
    - value: 6
      name: R57_STATE_UI_REFRESH
      description: UI refresh/render

# ============================================================================
# INPUT / SCAN CODE ENUMS
# ============================================================================

- name: ScanCode
  type: uint16_t
  description: |
    Keyboard scan codes used by input system.
    Stored in input_scan_code_queue (0x79B66)
  evidence:
    - address: 0x1562D1
      pattern: "mov es:input_scan_code_queue, 1Ch"
  values:
    - value: 0x01
      name: SCAN_ESC
      description: ESC key (exit/cancel)
      evidence: "cmp ax, 1; jnz at 0x156714"
      
    - value: 0x1C
      name: SCAN_ENTER
      description: ENTER key (confirm/select)
      evidence: "mov es:input_scan_code_queue, 1Ch at 0x1562D1"
      
    - value: 0xFF
      name: SCAN_SYNTHETIC
      description: Synthetic input (mouse click or generated)
      evidence: "cmp ax, 0FFh at 0x156726"
      
    - value: 0x00
      name: SCAN_NONE
      description: No input
      evidence: "mov es:input_scan_code_queue, 0 at 0x1562A0"

# ============================================================================
# MENU ELEMENT DISPATCHER ENUMS
# ============================================================================

- name: MenuElementType
  type: uint8_t
  description: |
    Menu element rendering types for R45 dispatcher.
    Dispatcher at 0x1573C3 switches on element index (0-10).
  evidence:
    - address: 0x1573CC
      pattern: "cmp bx, 0Ah; jbe; switch 11 cases"
  values:
    - value: 0
      name: ELEMENT_TYPE_0
      description: Render with ui_element_render_variant_a (conditional)
      evidence: "call ui_element_render_variant_a at 0x1573EA"
      
    - value: 1
      name: ELEMENT_TYPE_1
      description: Default case (no render?)
      evidence: Jump table case 1
      
    - value: 2
      name: ELEMENT_TYPE_2
      description: Default case (no render?)
      evidence: Jump table case 2
      
    - value: 3
      name: ELEMENT_TYPE_3
      description: Default case (no render?)
      evidence: Jump table case 3
      
    - value: 4
      name: ELEMENT_TYPE_4
      description: Default case (no render?)
      evidence: Jump table case 4
      
    - value: 5
      name: ELEMENT_TYPE_5
      description: Render with ui_element_render_variant_b (conditional)
      evidence: "call ui_element_render_variant_b at 0x157400"
      
    - value: 6
      name: ELEMENT_TYPE_6_SQUADRON
      description: Render "SQUADRON" button
      evidence: "call undoc_11C576 with SQUADRON string at 0x157417"
      
    - value: 7
      name: ELEMENT_TYPE_7
      description: Render with ui_element_render_complex_a
      evidence: "call ui_element_render_complex_a at 0x157442"
      
    - value: 8
      name: ELEMENT_TYPE_8
      description: Render with ui_element_render_complex_a (case 7-8 shared)
      evidence: Jump table case 8
      
    - value: 9
      name: ELEMENT_TYPE_9
      description: Render with utility_11c90f
      evidence: "call utility_11c90f at 0x157459"
      
    - value: 10
      name: ELEMENT_TYPE_10
      description: Render with ui_element_render_single or utility (case 9-10 shared)
      evidence: "call ui_element_render_single at 0x157461"
