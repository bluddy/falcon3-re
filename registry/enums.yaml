# Falcon 3.0 Enumerations Registry
# Synced with IDA database
#
# Format:
#   name: enum_name
#   type: uint8_t | uint16_t (size of enum)
#   values:
#     - value: numeric_value
#       name: ENUM_NAME
#       description: what this value means
#       evidence: where we found this (code/string address)

